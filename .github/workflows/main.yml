name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install cython==0.29.33 buildozer

      - name: Configure Git
        run: |
          git config --global user.email "builder@github.com"
          git config --global user.name "GitHub Builder"

      - name: Configure buildozer.spec
        working-directory: kivy_de_tu_calculadora
        run: |
          # Forzar aceptación de licencias en el spec existente
          sed -i 's/android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
          # Si la línea no existe, la agregamos
          if ! grep -q "android.accept_sdk_license" buildozer.spec; then
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi
          
          # Mostrar configuración para debug
          echo "=== Configuración de android en buildozer.spec ==="
          grep "android\." buildozer.spec

      - name: Build APK
        working-directory: kivy_de_tu_calculadora
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-apk-${{ steps.get-date.outputs.date }}
          path: kivy_de_tu_calculadora/bin/*.apk
