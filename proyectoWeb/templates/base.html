<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{% block title %}AJG Solution{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- COPIA ESTO: Configuración PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#ffc107"> <!-- Color amarillo de tu botón -->
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icono_calculadora.png') }}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-dark text-white">

<!-- NAVBAR GLOBAL -->
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">AJG Solution</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <!-- Inicio -->
                <li class="nav-item">
                    <!-- <a class="nav-link" href="/">Inicio</a> -->
                    <a class="nav-link" href="{{ url_for('views.inicio') }}">Inicio</a>
                </li>

                <!-- Acerca -->
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('views.acerca') }}">Acerca de Nosotros</a>
                </li>

                <!-- Submenú Consulta -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="consultaDropdown" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        Consulta
                    </a>

                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" href="{{ url_for('views.tendencia') }}">Tendencia</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('views.historial') }}">Historial</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('views.historial_tendencia') }}">Historial de Tendencia</a></li>
                    </ul>
                </li>
                    
                <!-- Contacto -->
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('views.contacto') }}">Contacto</a>     
                </li>

                <!-- Botón Calculadora -->
                <li class="nav-item ms-lg-3">
                    <a class="btn btn-warning fw-bold px-3" href="{{ url_for('views.calculadora') }}">
                        Calculadora
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- CONTENIDO DINÁMICO -->
{% block content %}
{% endblock %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      // Ahora lo buscamos en la raíz /sw.js
      navigator.serviceWorker.register("/sw.js");
    });
  }
</script>

{% block scripts %}
{% endblock %}

<!-- 1. BOTÓN FLOTANTE (Fuera de la ventana) -->
<button id="chat-bubble" onclick="toggleChat()" style="position: fixed; bottom: 20px; right: 20px; z-index: 4000; width: 60px; height: 60px; border-radius: 50%; border: none; background-color: #ffc107; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
    🗨️ 
</button>

<!-- 2. VENTANA DE CHAT -->
<div id="chat-window" class="card bg-dark text-white border-warning" 
     style="display: none !important; position: fixed; bottom: 90px; right: 20px; width: 320px; height: 450px; z-index: 3000; flex-direction: column; border-radius: 15px; overflow: hidden;">
    
    <div class="card-header bg-warning text-dark fw-bold d-flex justify-content-between align-items-center">
        <span>Asistente AJG</span>
        <button type="button" class="btn-close" onclick="toggleChat()"></button>
    </div>
    
    <div id="chat-body" class="card-body overflow-auto" style="flex: 1; font-size: 0.9rem; padding: 10px;">
        <p class="bg-secondary p-2 rounded">¡Hola! Soy la IA. Pregúntame sobre las tasas.</p>
    </div>
    
    <div class="card-footer border-secondary p-2">
        <div class="input-group">
            <input type="text" id="user-input" class="form-control bg-secondary text-white border-0" placeholder="Escribe aquí...">
            <button class="btn btn-warning" id="btn-enviar-chat">➤</button>
        </div>
    </div>
</div>

<!-- 3. SCRIPT (Fuera de los DIVs) -->
<script>
function toggleChat() {
    const chat = document.getElementById('chat-window');
    if (chat.style.getPropertyValue('display') === 'none' || chat.style.display === 'none') {
        chat.style.setProperty('display', 'flex', 'important');
    } else {
        chat.style.setProperty('display', 'none', 'important');
    }
}

document.addEventListener("DOMContentLoaded", function () {

    document.getElementById('btn-enviar-chat')
        .addEventListener('click', enviarPregunta);

    document.getElementById('user-input')
        .addEventListener('keypress', (e) => { 
            if(e.key === 'Enter') enviarPregunta(); 
        });

});

async function enviarPregunta() {
    const input = document.getElementById('user-input');
    const body = document.getElementById('chat-body');
    const pregunta = input.value.trim();

    if (!pregunta) return;

    body.innerHTML += `<p class="text-end"><strong>Tú:</strong> ${pregunta}</p>`;
    input.value = '';
    
    const loading = document.createElement('p');
    loading.className = "text-warning";
    loading.innerHTML = "<i>IA pensando...</i>";
    body.appendChild(loading);
    body.scrollTop = body.scrollHeight;

    try {
        const response = await fetch('/chat', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pregunta: pregunta })
        });
        const data = await response.json();
        loading.remove();
        body.innerHTML += `<div class="bg-secondary p-2 rounded mb-2"><strong>IA:</strong> ${data.respuesta}</div>`;
    } catch (e) {
        loading.innerText = "Error: Verifica la API Key.";
    }
    body.scrollTop = body.scrollHeight;
}
</script>



</body>
</html>
