<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{% block title %}AJG Solution{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-dark text-white">

<!-- NAVBAR GLOBAL -->
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">AJG Solution</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <!-- Inicio -->
                <li class="nav-item">
                    <!-- <a class="nav-link" href="/">Inicio</a> -->
                    <a class="nav-link" href="{{ url_for('views.inicio') }}">Inicio</a>
                </li>

                <!-- Acerca -->
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('views.acerca') }}">Acerca de Nosotros</a>
                </li>

                <!-- Submenú Consulta -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="consultaDropdown" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        Consulta
                    </a>

                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li>
                            <a class="dropdown-item" href="/tendencia">Tendencia</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/historial">Historial</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/historial-tendencia">
                                Historial de Tendencia
                            </a>
                        </li>
                    </ul>
                </li>

                <!-- Contacto -->
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('views.contacto') }}">Contacto</a>
                    
                </li>

                <!-- Botón Calculadora -->
                <li class="nav-item ms-lg-3">
                    <a class="btn btn-warning fw-bold px-3" href="{{ url_for('views.calculadora') }}">
                        Calculadora
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- CONTENIDO DINÁMICO -->
{% block content %}
{% endblock %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block scripts %}
{% endblock %}

</body>
</html>
