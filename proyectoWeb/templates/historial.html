{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <h2 class="mb-4">Historial</h2>

    <form method="POST" class="row g-3 mb-4">

        <div class="col-md-3">
            <select name="tipo" class="form-select" required>
                {% for tipo in tipos %}
                    <option value="{{ tipo }}">{{ tipo }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-3">
            <input type="date" name="fecha_inicio" class="form-control" required>
        </div>

        <div class="col-md-3">
            <input type="date" name="fecha_fin" class="form-control" required>
        </div>

        <div class="col-md-3">
            <button class="btn btn-success w-100">Consultar</button>
        </div>

    </form>

   {% if registros %}
    <p>
        <strong>Desde:</strong> {{ fecha_inicio }}
        <br>
        <strong>Hasta:</strong> {{ fecha_fin }}
    </p>

    <table class="table table-striped table-bordered shadow">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Valor</th>
            </tr>
        </thead>
        <tbody>
            {% for item in registros %}
            <tr>
                <td>{{ item.fecha.strftime("%d-%m-%Y %H:%M")  }}</td>
                <td>{{ item.tipo }}</td>
                <td>{{ item.valor }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endif %}

</div>

{% endblock %}
