{% extends "base.html" %}

{% block page_title %}Nuevo Cliente{% endblock %}

{% block content %}
<div class="table-container" style="overflow-x: auto; max-width: 900px; margin: 0 auto;">
    <div class="table-header">
        <h2><i class="fas fa-user-plus"></i> Nuevo Cliente</h2>
        <a href="{{ url_for('clientes.listar') }}" class="btn-modal">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </div>
    
    <form method="POST" style="margin-top: 2rem;">
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
            <!-- Documento -->
            <div class="form-group">
                <label>Tipo Documento</label>
                <select name="tipo_documento" class="form-control">
                    <option value="V">V - Venezolano</option>
                    <option value="E">E - Extranjero</option>
                    <option value="J">J - Jurídico</option>
                    <option value="G">G - Gobierno</option>
                </select>
            </div>
            <div class="form-group">
                <label>N° Documento</label>
                <input type="text" name="id_documento" class="form-control" required>
            </div>
            
            <!-- Nombre y Apellido -->
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" name="nombre" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Apellidos</label>
                <input type="text" name="apellidos" class="form-control" required>
            </div>
            
            <!-- Contacto -->
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" name="telefono" class="form-control">
            </div>
            <div class="form-group">
                <label>Teléfono Alternativo</label>
                <input type="tel" name="telefono_alternativo" class="form-control">
            </div>
            
            <!-- Email -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="form-group">
                <label>RIF</label>
                <input type="text" name="rif" class="form-control">
            </div>
            
            <!-- Dirección -->
            <div class="form-group">
                <label>Dirección</label>
                <textarea name="direccion" rows="2" class="form-control"></textarea>
            </div>
            <div class="form-group">
                <label>Ciudad</label>
                <input type="text" name="ciudad" class="form-control">
            </div>
            
            <!-- Ubicación -->
            <div class="form-group">
                <label>Estado/Provincia</label>
                <input type="text" name="estado" class="form-control">
            </div>
            <div class="form-group">
                <label>País</label>
                <input type="text" name="pais" class="form-control" value="Venezuela">
            </div>
            
            <!-- Información Compañía -->
            <div class="form-group">
                <label>Compañía</label>
                <input type="text" name="nombre_compania" class="form-control">
            </div>
            <div class="form-group">
                <label>Cargo</label>
                <input type="text" name="cargo" class="form-control">
            </div>
        </div>
        
        <!-- Notas -->
        <div class="form-group">
            <label>Notas</label>
            <textarea name="notas" rows="3" class="form-control"></textarea>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn-primary">
                <i class="fas fa-save"></i> Guardar Cliente
            </button>
            <a href="{{ url_for('clientes.listar') }}" class="btn-modal">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
