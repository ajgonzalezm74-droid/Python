<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - ContiPro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="login-wrapper" style="max-width: 500px; margin: 0 auto;">
            <div class="login-panel" style="width: 100%;">
                <div class="login-container">
                    <div class="login-header">
                        <i class="fas fa-key" style="font-size: 48px; color: var(--primary-color); margin-bottom: 20px;"></i>
                        <h2>Recuperar Contraseña</h2>
                        <p>Ingresa tu correo electrónico y te enviaremos instrucciones</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }}">
                                    <i class="fas fa-{% if category == 'error' %}exclamation-circle{% else %}check-circle{% endif %}"></i>
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('auth.recuperar_password') }}" class="login-form">
                        <div class="form-group">
                            <label for="email">
                                <i class="fas fa-envelope"></i>
                                Correo Electrónico
                            </label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="tucorreo@ejemplo.com"
                                required
                                autocomplete="email"
                            >
                        </div>

                        <button type="submit" class="btn-login">
                            <i class="fas fa-paper-plane"></i>
                            Enviar Instrucciones
                        </button>

                        <div style="text-align: center; margin-top: 20px;">
                            <a href="{{ url_for('auth.login') }}" class="forgot-password">
                                <i class="fas fa-arrow-left"></i> Volver al Login
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
